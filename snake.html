<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

  <div class="flex flex-col items-center max-w-md w-full bg-slate-800 p-6 rounded-2xl shadow-xl">
    <h1 class="text-3xl font-bold mb-2 text-green-400">Snake Game</h1>
    
    <div class="text-xl font-semibold mb-4 text-slate-300">
      Score: <span id="score" class="text-green-400">0</span>
  <div>High Score: <span id="high-score" class="text-yellow-400">0</span></div>
</div>



    <!-- Canvas wrapper -->
    <div class="w-full aspect-square border-2 border-slate-700 rounded-xl overflow-hidden mb-6 bg-slate-950 flex justify-center items-center">
      <canvas id="gameCanvas" width="400" height="400" class="w-full h-full object-contain"></canvas>
    </div>

    <button id="start-btn" class="w-full py-3 bg-green-600 hover:bg-green-500 rounded-xl font-semibold transition-colors shadow-lg">Start Game</button>
  </div>

  <script src="snake.js"></script>
</body>
</html>
